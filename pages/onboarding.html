<div class="form-box wide">
  <div class="progress"><div id="progress-fill"></div></div>
  <p id="ob-step-label" class="small"></p>
  <h2 id="ob-title"></h2>
  <div id="ob-fields"></div>
  <div class="row">
    <button class="btn-outline" onclick="prevStep()">Back</button>
    <button class="btn" id="ob-next" onclick="nextStep()">Continue</button>
  </div>
  <p id="ob-error" class="error"></p>
</div>
