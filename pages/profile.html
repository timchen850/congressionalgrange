<h1>Your Profile</h1>
<div id="profile-info"></div>
<button class="btn" onclick="editProfile()">Edit answers</button>

<h2>Past proposals</h2>
<p class="small">Upload old proposals so new drafts sound like you.</p>
<textarea id="past-text" rows="5" placeholder="Paste a past proposal here"></textarea>
<button class="btn" onclick="uploadPastProposal()">Save it</button>
<p id="past-status" class="small"></p>
