<div class="form-box">
  <h2 id="login-title">Log in</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button class="btn" onclick="handleLogin()">Continue</button>
  <button class="btn-outline" onclick="logInWithGoogle()">Continue with Google</button>
  <p class="small">
    <a href="#" onclick="toggleSignUp()" id="switch-link">Don't have an account? Sign up</a>
  </p>
  <p id="login-error" class="error"></p>
</div>
