<h1>Grant Assistant</h1>
<p class="small">Ask anything about grants or your applications.</p>
<div id="chat-box"></div>
<div class="row">
  <input type="text" id="chat-input" placeholder="Type a question..." onkeydown="if (event.key === 'Enter') sendChat()">
  <button class="btn" onclick="sendChat()">Send</button>
  <button class="btn-outline" onclick="clearChat()">Clear</button>
</div>
